name: Android debug APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/vector-companion-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: vector-companion-debug-apk
          path: android/out/*.apk
          retention-days: 30
